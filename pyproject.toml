[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reconmap"
version = "0.1.0"
description = "Passive Attack Surface Intelligence Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "dnspython>=2.6",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "httpx>=0.27",
]

[project.scripts]
reconmap = "reconmap.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/reconmap"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["reconmap"]
